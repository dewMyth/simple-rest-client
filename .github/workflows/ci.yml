name: CI

on:
  push:
    branches: [main]
    # Release tags, with or without a leading "v": 0.1.0, v0.1.0, 1.2.0-beta.1
    tags: ['v[0-9]+.[0-9]+.[0-9]+*', '[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build installers for (e.g. 0.1.0). Leave empty to only run tests.'
        required: false
        default: ''

env:
  # The tag being released, from a tag push or the manual input. Empty for normal CI runs.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: End-to-end tests
        run: npx playwright test

  installers:
    name: installers (${{ matrix.os }})
    needs: test
    if: github.ref_type == 'tag' || inputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "::error::Tag $RELEASE_TAG doesn't match package.json version $version. Update package.json, commit, and tag again."
            exit 1
          fi

      - run: npm run build

      - name: Build installers
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --mac --publish never
          else
            npx electron-builder --win --publish never
          fi
        env:
          # Signing stays off until these secrets exist. See "Code signing" in README.md.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Report installer sizes
        shell: bash
        run: ls -l release/*.dmg release/*.exe 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    name: attach to release
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - run: ls -l dist

      # Adds the installers to the GitHub Release for this tag, creating the release if needed.
      # An existing release keeps its title and notes.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.dmg
            dist/*.exe
          fail_on_unmatched_files: true
